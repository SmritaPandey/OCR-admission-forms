name: Build Desktop App

on:
  push:
    branches: [ "feature/desktop-packaging", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-desktop.txt
        pip install pyinstaller

    - name: Install System Dependencies (Windows)
      run: |
        choco install tesseract --yes
        choco install poppler --yes

    - name: Build Backend (PyInstaller)
      working-directory: ./backend
      run: |
        pyinstaller pyinstaller.spec --distpath ../backend-dist

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Frontend (Next.js)
      run: npm run build
      # This creates .next folder with production build

    - name: Install Electron Dependencies
      working-directory: ./electron
      run: npm install --legacy-peer-deps

    - name: Build Electron App (Windows)
      working-directory: ./electron
      run: npm run dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OCR-Form-Extractor-Setup
        path: electron/dist/*.exe
