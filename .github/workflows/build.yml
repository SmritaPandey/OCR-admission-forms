name: Build Desktop App

on:
  push:
    branches: [ "feature/desktop-packaging", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Install System Dependencies (Windows)
      run: |
        choco install tesseract
        choco install poppler
        # Add to PATH is usually handled by choco, but we might need to verify

    - name: Build Backend (PyInstaller)
      run: |
        pyinstaller backend/pyinstaller.spec
        # Move dist/api to backend-dist/api for clarity if needed, 
        # but pyinstaller outputs to dist/api by default.
        # electron-builder expects it in ../backend-dist/api based on my config?
        # Let's fix the move step or config.
        # My package.json extraResources: "from": "../backend-dist/api"
        # So I need to move it or change spec.
        mkdir backend-dist
        move dist\api backend-dist\api

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      run: npm install

    - name: Build Frontend (Next.js Export)
      run: npm run build
      # This creates 'out' folder in root

    - name: Install Electron Dependencies
      working-directory: ./electron
      run: npm install

    - name: Build Electron App (Windows)
      working-directory: ./electron
      run: npm run dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OCR-Form-Extractor-Setup
        path: electron/dist/*.exe
