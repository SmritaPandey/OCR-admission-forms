name: Build Desktop App

on:
  push:
    branches: [ "feature/desktop-packaging", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-desktop.txt
        pip install pyinstaller

    - name: Install System Dependencies (Windows)
      run: |
        choco install tesseract --yes
        choco install poppler --yes

    - name: Restore sensitive data from secrets
      shell: bash
      run: |
        # Create .env file from secret (using bash to avoid PowerShell parsing issues)
        if [ -n "${{ secrets.ENV_FILE }}" ]; then
          echo '${{ secrets.ENV_FILE }}' > .env
          echo "Created .env file"
        fi
        
        # Create Google Cloud credentials from secret
        if [ -n "${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}" ]; then
          echo '${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}' > google-cloud-credentials.json
          echo "Created credentials file"
        fi

    - name: Restore database from secret
      if: ${{ secrets.DATABASE_BASE64 != '' }}
      shell: pwsh
      run: |
        $dbBase64 = "${{ secrets.DATABASE_BASE64 }}"
        if ($dbBase64 -and $dbBase64.Length -gt 10) {
          [System.IO.File]::WriteAllBytes("admission_forms.db", [System.Convert]::FromBase64String($dbBase64))
          echo "Restored database"
        }

    - name: Build Backend (PyInstaller)
      working-directory: ./backend
      run: |
        pyinstaller pyinstaller.spec --distpath ../backend-dist

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Frontend (Next.js Standalone)
      run: npm run build

    - name: Install Electron Dependencies
      working-directory: ./electron
      run: npm install --legacy-peer-deps

    - name: Generate Windows Icon
      working-directory: ./electron
      run: |
        npm install png-to-ico --save-dev
        npx png-to-ico resources/icon.png > resources/icon.ico

    - name: Build Electron App (Windows)
      working-directory: ./electron
      run: npm run dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OCR-Form-Extractor-Setup
        path: electron/dist/*.exe
