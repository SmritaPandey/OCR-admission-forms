services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./admission_forms.db:/app/admission_forms.db
    environment:
      - DATABASE_URL=sqlite:///./admission_forms.db
      - OCR_PROVIDER=craft-trocr
      - ENVIRONMENT=production
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    restart: always
